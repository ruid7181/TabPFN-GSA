[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpfn-gsa"
version = "0.1.0"
description = "Geospatial Sparse Attention (GSA) for TabPFN: spatially localised in-context learning for geospatial tabular data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Rui Deng" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "optuna>=4.0",
  "tabpfn",
]

[project.urls]
Homepage = "https://github.com/ruid7181/TabPFN-GSA"
Repository = "https://github.com/ruid7181/TabPFN-GSA"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
